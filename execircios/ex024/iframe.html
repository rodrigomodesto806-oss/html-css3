<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testanto o uso de um iframe</h1>
    <p>
        Acessando o site do 

        <iframe src="https://www.cursoemvideo.com" 
        frameborder="0" height="500" scolling="yes">
        <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
    </iframe>

        para aprender a programar.
    </p>
    <p>O site do <iframe src="https://rodrigomodesto806-oss.github.io/projeto-cordel/" frameborder="0" height="500" width="500"> no <a href="https://rodrigomodesto806-oss.github.io/projeto-cordel/">github</a></iframe>
    
        também e bem legal!
    </p>
</body>
</html>
