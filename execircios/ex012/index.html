<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospeado no meu proprio servidor</p>

    <video width="560" poster="imagens/baleia.jpg" controls autoplay loop>
        <source srcset="midia/meu-video.mp4" type="video/mp4">
        <source srcset="midia/meu-video2.mp4v" type="video/mp4">
        <source srcset="midia/meu-video2.webm" type="video/webm">
        <source srcset="midia/meu-video2.ogv" type="video/ogg">
        <p>seu navegador não tem compatibilidade com reprodução de vídeos</p>
    </video>

    <h1>Inserindo vídeos do YouTube</h1>
    <iframe src="560" height="315 src="<iframe width="560" height="315" src="https://www.youtube.com/embed/jPWsBuiy1rE?si=ShLX18l2GmGgJBhO" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; allowfullscreen"></iframe>
</body>
</html>
