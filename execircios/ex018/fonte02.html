<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com Google fonts</title>
</head>
<style>
    @font-face {
        font-family: 'friend';
        src: url(Friend\ Bestie.otf) format(opentype), url(Friend\ Bestie.otf);
        font-weight: normal;
        font-style: normal;
    }

    /* Tipos de format()
        - opentype (otf)
        -truetype (ttf)
        embedded-opentype
        -truetype-aat (Apple advanced typography)
        - svg*/
    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    h1 {
        font-family: 'friend';
        font-size: 3em;
        font-weight: normal;
    }
</style>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Voluptate, consectetur, soluta quis repellat quae voluptatem saepe iusto pariatur dolorem odit illum! Fugiat pariatur eaque distinctio quibusdam quis temporibus ratione est.</p>
</body>
</html>
